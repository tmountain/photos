<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Travis Whitton — Photographs</title>
<meta name="description" content="Photographs by Travis Whitton.">
<style>
  :root {
    --bg: #f6f5f2;
    --text: #1c1c1a;
    --muted: #77756f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110;
      --text: #e9e7e2;
      --muted: #8d8b85;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  header, footer {
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px 16px;
  }
  h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  header p, footer {
    margin: 0;
    color: var(--muted);
  }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 16px;
  }
  figure {
    margin: 0 0 96px;
  }
  img {
    display: block;
    max-width: 100%;
    max-height: 92vh;
    width: auto;
    height: auto;
    margin: 0 auto;
  }
  figcaption {
    margin-top: 12px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }
  @media (max-width: 600px) {
    header, footer { padding: 32px 16px; }
    figure { margin-bottom: 56px; }
  }
</style>
</head>
<body>

<header>
  <h1>Travis Whitton</h1>
  <p>Photographs</p>
</header>

<main>
  <figure>
    <img src="images/balcony.jpg" width="2000" height="1800" alt="A woman stands in profile on a rooftop balcony draped with orange cloth and white lace, against a blue sky.">
    <figcaption>Balcony</figcaption>
  </figure>

  <figure>
    <img src="images/lifebuoy.jpg" width="2000" height="1329" alt="An orange lifebuoy on a pole beside an empty lifeguard chair, with a lone swimmer sitting on the sand under a wide blue sky." loading="lazy">
    <figcaption>Lifebuoy</figcaption>
  </figure>

  <figure>
    <img src="images/cliffs.jpg" width="2000" height="1000" alt="Sea mist glowing in low sun against tall cliffs above a beach with scattered people." loading="lazy">
    <figcaption>Cliffs</figcaption>
  </figure>

  <figure>
    <img src="images/beach.jpg" width="2000" height="1125" alt="A small child runs across a beach with arms out while one adult films and another looks on, in hazy golden light." loading="lazy">
    <figcaption>Beach</figcaption>
  </figure>

  <figure>
    <img src="images/terrace.jpg" width="2000" height="1600" alt="A black dog stands on a box with its paws on a terrace wall, looking back from the sea at dusk." loading="lazy">
    <figcaption>Terrace</figcaption>
  </figure>

  <figure>
    <img src="images/horse.jpg" width="2000" height="1333" alt="A cream-coloured horse in profile against a grey wall, wearing a teal halter and tied with a red rope." loading="lazy">
    <figcaption>Horse</figcaption>
  </figure>

  <figure>
    <img src="images/attic.jpg" width="1500" height="2000" alt="Black and white view of an attic roof truss, lit by a single tube light above a pale door." loading="lazy">
    <figcaption>Attic</figcaption>
  </figure>

  <figure>
    <img src="images/statues.jpg" width="2000" height="1125" alt="Eight marble statues on wooden plinths arranged in a semicircle in a red-walled museum room." loading="lazy">
    <figcaption>Eight statues</figcaption>
  </figure>

  <figure>
    <img src="images/madrid-street.jpg" width="1333" height="2000" alt="Two people with umbrellas walk along a narrow, rain-soaked street under amber street lamps at night." loading="lazy">
    <figcaption>Rain</figcaption>
  </figure>

  <figure>
    <img src="images/corner.jpg" width="1200" height="2000" alt="A man strides past a corner café with a red awning, beneath a weathered apartment building." loading="lazy">
    <figcaption>Corner</figcaption>
  </figure>

  <figure>
    <img src="images/dusk.jpg" width="1500" height="2000" alt="A crescent moon and a bright evening star above warmly lit apartment buildings at dusk, with city lights glowing below an orange horizon." loading="lazy">
    <figcaption>Dusk</figcaption>
  </figure>
</main>

<footer>&copy; 2026 Travis Whitton</footer>

</body>
</html>
